name: E2E

# Pull requests cover feature branches; the push trigger is limited to main so a PR branch
# doesn't run this expensive job twice for the same commit.
on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]
  workflow_dispatch: {}

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: connectsphere
          POSTGRES_PASSWORD: connectsphere
          POSTGRES_DB: connectsphere
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://connectsphere:connectsphere@localhost:5432/connectsphere
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Start backend
        working-directory: backend
        # nohup + log file: a bare "&" dies with the step's shell and leaves nothing to debug.
        run: nohup uvicorn app.main:app --port 8000 > /tmp/uvicorn.log 2>&1 &

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Wait for backend
        # http-get:// (not http://) because wait-on probes with HEAD by default, which this
        # GET-only route answers with 405 — so it waited forever. The timeout is a backstop:
        # without it the job burns the full 6-hour limit instead of failing.
        run: npx --yes wait-on --timeout 60000 http-get://localhost:8000/api/events/health

      - name: Backend log
        if: failure()
        run: cat /tmp/uvicorn.log

      - name: Run e2e tests
        working-directory: e2e
        run: npm test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
