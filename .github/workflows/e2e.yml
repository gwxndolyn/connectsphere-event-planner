name: E2E

# Pull requests cover feature branches; the push trigger is limited to main so a PR branch
# doesn't run this expensive job twice for the same commit.
on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]
  workflow_dispatch: {}

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: connectsphere
          POSTGRES_PASSWORD: connectsphere
          POSTGRES_DB: connectsphere
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://connectsphere:connectsphere@localhost:5432/connectsphere
      # The E2E journeys identify users with the dev header stubs (US16a, SCRUM-102).
      AUTH_DEV_HEADERS: "true"
      # The existing journeys run in dev mode ("Acting as"); tests/login.spec.ts gets its own
      # frontend with VITE_DEV_AUTH unset (SCRUM-105). Its logged-in cases skip without E2E_SEED_PASSWORD.
      VITE_DEV_AUTH: "true"
      VITE_DEV_USER_ID: 6c200a77-b7cc-5fb1-9d51-81a0abeba24b
      VITE_DEV_COORDINATOR_ID: 2aac679a-f014-5437-b43a-d150447a6336
      VITE_DEV_LEAD_ID: 78c61ada-12c1-543f-8838-d559f1ece279
      VITE_DEV_VENUE_STAFF_ID: 4e8d2398-4b1e-5e59-900e-4ddb311a243f
      VITE_DEV_ATTENDEE_ID: 83565d3f-e757-5c0e-8c6e-8dadb298ce18
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Prepare database
        working-directory: backend
        run: |
          alembic upgrade head
          python -m app.seed

      - name: Start backend
        working-directory: backend
        # nohup + log file: a bare "&" dies with the step's shell and leaves nothing to debug.
        run: nohup uvicorn app.main:app --port 8000 > /tmp/uvicorn.log 2>&1 &

      - uses: actions/setup-node@v4
        with:
          # .nvmrc: Node 22, which Vitest 5, jsdom 30 and MSW 3 need. engines in package.json enforces it.
          node-version-file: .nvmrc

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Wait for backend
        # http-get:// (not http://) because wait-on probes with HEAD by default, which this
        # GET-only route answers with 405 — so it waited forever. The timeout is a backstop:
        # without it the job burns the full 6-hour limit instead of failing.
        run: npx --yes wait-on --timeout 60000 http-get://localhost:8000/api/events/health

      - name: Backend log
        if: failure()
        run: cat /tmp/uvicorn.log

      - name: Run e2e tests
        working-directory: e2e
        run: npm test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
