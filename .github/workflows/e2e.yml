name: E2E

# Runs on every push/PR (matching this repo's branch model) plus manual dispatch. On PRs it's
# skipped (not failed) when the diff doesn't touch backend/frontend/e2e, so it never blocks
# unrelated changes (e.g. docs-only PRs).
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch: {}

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        run: |
          git fetch --no-tags --prune --depth=1 origin ${{ github.base_ref }}
          changed=$(git diff --name-only --diff-filter=AM HEAD origin/${{ github.base_ref }} -- e2e/ frontend/ backend/ | wc -l)
          if [ "$changed" -gt 0 ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  e2e:
    needs: [detect-changes]
    if: always() && (github.event_name != 'pull_request' || needs.detect-changes.outputs.changed == 'true')
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: connectsphere
          POSTGRES_PASSWORD: connectsphere
          POSTGRES_DB: connectsphere
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://connectsphere:connectsphere@localhost:5432/connectsphere
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Start backend
        working-directory: backend
        run: uvicorn app.main:app --port 8000 &

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Wait for backend
        run: npx --yes wait-on http://localhost:8000/api/events/health

      - name: Run e2e tests
        working-directory: e2e
        run: npm test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
