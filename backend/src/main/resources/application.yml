spring:
  application:
    name: event-planner

  # H2 for local dev. Swap this block for MySQL/Postgres in production:
  #   url: jdbc:mysql://localhost:3306/connectsphere
  #   driver-class-name: com.mysql.cj.jdbc.Driver
  datasource:
    url: jdbc:h2:mem:connectsphere
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false

  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080
